<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local RAG Retrieval</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1e2329;
      --muted: #667085;
      --border: #d9dee7;
      --accent: #2563eb;
      --accent-strong: #1d4ed8;
      --ok: #047857;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .search-panel,
    .result {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .search-panel {
      padding: 16px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      font: inherit;
      background: #fff;
    }

    textarea:focus,
    select:focus,
    input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.2);
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: end;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .control {
      min-width: 128px;
    }

    select,
    input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    button {
      height: 40px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-strong); }
    button:disabled { opacity: 0.65; cursor: not-allowed; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-button {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .tab-button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .view[hidden] {
      display: none;
    }

    .summary {
      color: var(--muted);
      font-size: 14px;
      margin: 10px 0 14px;
    }

    .result {
      padding: 14px;
      margin-bottom: 12px;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .rank {
      font-weight: 800;
      color: var(--text);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      background: #fafafa;
    }

    .score {
      color: var(--ok);
      font-weight: 800;
      white-space: nowrap;
    }

    .chunk-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    .answer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .answer-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      margin-top: 10px;
    }

    .error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    @media (max-width: 720px) {
      header { display: block; }
      .status { margin-top: 10px; text-align: left; }
      .controls { align-items: stretch; }
      .control, button { width: 100%; }
      .result-head { display: block; }
      .score { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Local RAG Retrieval</h1>
        <p class="subtitle">Vector, BM25, and hybrid RRF search over ChromaDB chunks</p>
      </div>
      <div class="status" id="status">Checking collection...</div>
    </header>

    <nav class="tabs">
      <button class="tab-button active" id="labTab" type="button">Retrieval Lab</button>
      <button class="tab-button" id="chatTab" type="button">Chat</button>
    </nav>

    <section class="view" id="labView">
      <section class="search-panel">
        <label for="query">Query</label>
        <textarea id="query" placeholder="Example: Who are the Dursleys?"></textarea>

        <div class="controls">
          <div class="control">
            <label for="topK">Top K</label>
            <select id="topK">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
          </div>
          <div class="control">
            <label for="searchMode">Mode</label>
            <select id="searchMode">
              <option value="hybrid" selected>Hybrid</option>
              <option value="vector">Vector</option>
              <option value="bm25">BM25</option>
            </select>
          </div>
          <div class="control">
            <label for="year">Year</label>
            <input id="year" type="number" min="0" placeholder="Any" />
          </div>
          <div class="control">
            <label for="author">Author</label>
            <input id="author" type="text" placeholder="Any" />
          </div>
          <div class="control">
            <label for="documentType">Type</label>
            <input id="documentType" type="text" placeholder="book" />
          </div>
          <button id="searchButton">Search</button>
          <button id="rerankButton" disabled>Rerank top 5</button>
        </div>
        <div id="error"></div>
      </section>

      <section id="results"></section>
    </section>

    <section class="view" id="chatView" hidden>
      <section class="search-panel">
        <label for="chatQuery">Question</label>
        <textarea id="chatQuery" placeholder="Example: Кто такой Гарри Поттер?"></textarea>

        <div class="controls">
          <div class="control">
            <label for="contextStrategy">Context strategy</label>
            <select id="contextStrategy">
              <option value="auto" selected>Auto</option>
              <option value="direct">Direct</option>
              <option value="map_reduce">Map-reduce</option>
            </select>
          </div>
          <button id="askButton">Ask</button>
        </div>
        <div id="chatError"></div>
      </section>

      <section id="answerResults"></section>
    </section>
  </main>

  <script>
    const statusNode = document.getElementById("status");
    const errorNode = document.getElementById("error");
    const resultsNode = document.getElementById("results");
    const labTab = document.getElementById("labTab");
    const chatTab = document.getElementById("chatTab");
    const labView = document.getElementById("labView");
    const chatView = document.getElementById("chatView");
    const button = document.getElementById("searchButton");
    const rerankButton = document.getElementById("rerankButton");
    const queryNode = document.getElementById("query");
    const topKNode = document.getElementById("topK");
    const searchModeNode = document.getElementById("searchMode");
    const yearNode = document.getElementById("year");
    const authorNode = document.getElementById("author");
    const documentTypeNode = document.getElementById("documentType");
    const chatErrorNode = document.getElementById("chatError");
    const answerResultsNode = document.getElementById("answerResults");
    const askButton = document.getElementById("askButton");
    const chatQueryNode = document.getElementById("chatQuery");
    const contextStrategyNode = document.getElementById("contextStrategy");
    let lastSearchData = null;

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatScore(value) {
      if (value === null || value === undefined) return "n/a";
      return Number(value).toFixed(4);
    }

    async function loadHealth() {
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Health check failed");
        statusNode.textContent = `${data.collection} | ${data.count} chunks | ${data.embedding_model} | ${data.chat_model}`;
      } catch (error) {
        statusNode.textContent = "Collection unavailable";
      }
    }

    function switchView(view) {
      const showLab = view === "lab";
      labView.hidden = !showLab;
      chatView.hidden = showLab;
      labTab.classList.toggle("active", showLab);
      chatTab.classList.toggle("active", !showLab);
    }

    function renderResults(data) {
      const summaryLine = data.reranker_model
        ? `Reranker: ${escapeHtml(data.reranker_model)} | Input candidates: ${data.input_count} | Results: ${data.results.length}`
        : `Mode: ${escapeHtml(data.search_mode)} | Collection: ${escapeHtml(data.collection)} | Model: ${escapeHtml(data.embedding_model)} | Results: ${data.results.length}`;
      const summary = `
        <div class="summary">
          Query: <strong>${escapeHtml(data.query)}</strong><br>
          ${summaryLine}
          ${data.warning ? `<br><strong>${escapeHtml(data.warning)}</strong>` : ""}
        </div>
      `;

      const cards = data.results.map((item) => `
        <article class="result">
          <div class="result-head">
            <div>
              <div class="rank">#${item.rank} | ${escapeHtml(item.id)}</div>
              <div class="meta">
                <span class="pill">chunk_id: ${item.chunk_id ?? "n/a"}</span>
                <span class="pill">vector_rank: ${item.vector_rank ?? "n/a"}</span>
                <span class="pill">bm25_rank: ${item.bm25_rank ?? "n/a"}</span>
                <span class="pill">original_rank: ${item.original_rank ?? "n/a"}</span>
                <span class="pill">year: ${item.year ?? "n/a"}</span>
                <span class="pill">type: ${escapeHtml(item.document_type ?? "n/a")}</span>
                <span class="pill">author: ${escapeHtml(item.author ?? "n/a")}</span>
                <span class="pill">characters: ${item.characters ?? "n/a"}</span>
                <span class="pill">distance: ${formatScore(item.distance)}</span>
                <span class="pill">bm25: ${formatScore(item.bm25_score)}</span>
                <span class="pill">rrf: ${formatScore(item.rrf_score)}</span>
                <span class="pill">rerank: ${formatScore(item.rerank_score)}</span>
              </div>
              <div class="meta">
                <span class="pill">title: ${escapeHtml(item.title ?? "n/a")}</span>
              </div>
            </div>
            <div class="score">similarity ${formatScore(item.similarity)}</div>
          </div>
          <div class="chunk-text">${escapeHtml(item.text)}</div>
        </article>
      `).join("");

      resultsNode.innerHTML = summary + cards;
    }

    function renderAnswer(data) {
      const summaries = data.map_summaries && data.map_summaries.length
        ? `
          <div class="summary">Map summaries</div>
          ${data.map_summaries.map((summary, index) => `
            <article class="result">
              <div class="rank">Map #${index + 1}</div>
              <div class="chunk-text">${escapeHtml(summary)}</div>
            </article>
          `).join("")}
        `
        : "";
      const sources = data.sources.map((item) => `
        <article class="result">
          <div class="result-head">
            <div>
              <div class="rank">Source #${item.rank} | ${escapeHtml(item.id)}</div>
              <div class="meta">
                <span class="pill">original_rank: ${item.original_rank ?? "n/a"}</span>
                <span class="pill">rerank: ${formatScore(item.rerank_score)}</span>
                <span class="pill">year: ${item.year ?? "n/a"}</span>
                <span class="pill">title: ${escapeHtml(item.title ?? "n/a")}</span>
              </div>
            </div>
          </div>
          <div class="chunk-text">${escapeHtml(item.text)}</div>
        </article>
      `).join("");

      answerResultsNode.innerHTML = `
        <article class="answer">
          <div class="summary">
            Query: <strong>${escapeHtml(data.query)}</strong><br>
            Model: ${escapeHtml(data.chat_model)} | Strategy: ${escapeHtml(data.strategy)} | Context tokens: ${data.estimated_context_tokens}/${data.context_token_limit}<br>
            Retrieval top-k: ${data.retrieval_top_k} | Rerank top-n: ${data.rerank_top_n}
            ${data.warning ? `<br><strong>${escapeHtml(data.warning)}</strong>` : ""}
          </div>
          <div class="answer-text">${escapeHtml(data.answer)}</div>
        </article>
        ${summaries}
        <div class="summary">Sources</div>
        ${sources}
      `;
    }

    async function runSearch() {
      const query = queryNode.value.trim();
      const topK = Number(topKNode.value);
      const searchMode = searchModeNode.value;
      const year = yearNode.value ? Number(yearNode.value) : null;
      const author = authorNode.value.trim() || null;
      const documentType = documentTypeNode.value.trim() || null;

      errorNode.innerHTML = "";
      resultsNode.innerHTML = "";
      lastSearchData = null;
      rerankButton.disabled = true;

      if (!query) {
        errorNode.innerHTML = '<div class="error">Enter a query first.</div>';
        return;
      }

      button.disabled = true;
      rerankButton.disabled = true;
      button.textContent = "Searching...";

      try {
        const response = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            top_k: topK,
            search_mode: searchMode,
            year,
            author,
            document_type: documentType,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Search failed");
        lastSearchData = data;
        rerankButton.disabled = data.search_mode !== "hybrid" || data.results.length === 0;
        renderResults(data);
      } catch (error) {
        errorNode.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      } finally {
        button.disabled = false;
        button.textContent = "Search";
      }
    }

    async function runRerank() {
      if (!lastSearchData || !lastSearchData.results.length) {
        errorNode.innerHTML = '<div class="error">Run Hybrid search first.</div>';
        return;
      }

      errorNode.innerHTML = "";
      rerankButton.disabled = true;
      rerankButton.textContent = "Reranking...";

      try {
        const response = await fetch("/api/rerank", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: lastSearchData.query,
            candidates: lastSearchData.results,
            top_n: 5,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Rerank failed");
        renderResults(data);
      } catch (error) {
        errorNode.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      } finally {
        rerankButton.disabled = false;
        rerankButton.textContent = "Rerank top 5";
      }
    }

    async function runAnswer() {
      const query = chatQueryNode.value.trim();
      const strategy = contextStrategyNode.value;

      chatErrorNode.innerHTML = "";
      answerResultsNode.innerHTML = "";

      if (!query) {
        chatErrorNode.innerHTML = '<div class="error">Enter a question first.</div>';
        return;
      }

      askButton.disabled = true;
      askButton.textContent = "Thinking...";

      try {
        const response = await fetch("/api/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            strategy,
            retrieval_top_k: 20,
            rerank_top_n: 5,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Answer generation failed");
        renderAnswer(data);
      } catch (error) {
        chatErrorNode.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      } finally {
        askButton.disabled = false;
        askButton.textContent = "Ask";
      }
    }

    labTab.addEventListener("click", () => switchView("lab"));
    chatTab.addEventListener("click", () => switchView("chat"));
    button.addEventListener("click", runSearch);
    rerankButton.addEventListener("click", runRerank);
    askButton.addEventListener("click", runAnswer);
    queryNode.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        runSearch();
      }
    });
    chatQueryNode.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        runAnswer();
      }
    });

    loadHealth();
  </script>
</body>
</html>
