<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local RAG Retrieval</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f7fb;
      --panel: #ffffff;
      --text: #1e2329;
      --muted: #667085;
      --border: #d9dee7;
      --accent: #7c3aed;
      --accent-strong: #6d28d9;
      --accent-soft: #ede9fe;
      --accent-quiet: #f5f3ff;
      --ok: #047857;
      --chat-bg: #fbfaff;
      --assistant-bubble: #ffffff;
      --user-bubble: #7c3aed;
      --shadow: 0 18px 55px rgba(46, 25, 91, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .search-panel,
    .result {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .search-panel {
      padding: 16px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      font: inherit;
      background: #fff;
    }

    textarea:focus,
    select:focus,
    input:focus {
      outline: 2px solid rgba(124, 58, 237, 0.2);
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: end;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .control {
      min-width: 128px;
    }

    select,
    input {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    button {
      height: 40px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--accent-strong); }
    button:disabled { opacity: 0.65; cursor: not-allowed; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-button {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .tab-button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .view[hidden] {
      display: none;
    }

    .summary {
      color: var(--muted);
      font-size: 14px;
      margin: 10px 0 14px;
    }

    .result {
      padding: 14px;
      margin-bottom: 12px;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .rank {
      font-weight: 800;
      color: var(--text);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      background: #fafafa;
    }

    .score {
      color: var(--ok);
      font-weight: 800;
      white-space: nowrap;
    }

    .chunk-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    .answer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .answer-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
      margin-top: 10px;
    }

    .secondary-button {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .secondary-button:hover {
      background: #eef2f7;
    }

    .chat-shell {
      height: min(760px, calc(100vh - 160px));
      min-height: 560px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .chat-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
    }

    .chat-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .chat-actions {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chat-actions .control {
      min-width: 150px;
    }

    .compact-label {
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .chat-thread {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(245, 243, 255, 0.72), rgba(255, 255, 255, 0.88) 36%),
        var(--chat-bg);
    }

    .empty-chat {
      margin: auto;
      max-width: 420px;
      text-align: center;
      color: var(--muted);
    }

    .empty-chat-title {
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 88%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.assistant,
    .message-row.error {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0;
      color: var(--accent-strong);
      background: var(--accent-soft);
      border: 1px solid #ddd6fe;
    }

    .message-row.user .avatar {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .message-bubble {
      min-width: 0;
      max-width: min(760px, 100%);
      border-radius: 8px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--assistant-bubble);
    }

    .message-row.user .message-bubble {
      color: #fff;
      border-color: var(--accent);
      background: var(--user-bubble);
    }

    .message-row.error .message-bubble {
      color: #9f1239;
      border-color: #fecdd3;
      background: #fff1f2;
    }

    .message-role {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .message-row.user .message-role {
      color: rgba(255, 255, 255, 0.78);
    }

    .message-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .assistant-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .assistant-meta .pill {
      background: var(--accent-quiet);
      border-color: #ddd6fe;
    }

    .source-details,
    .map-details {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .source-details summary,
    .map-details summary {
      cursor: pointer;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 800;
    }

    .source-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .source-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: #fcfcfd;
    }

    .source-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .source-preview {
      color: var(--muted);
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
    }

    .thinking span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s infinite ease-in-out;
    }

    .thinking span:nth-child(2) { animation-delay: 0.16s; }
    .thinking span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    .chat-composer-wrap {
      padding: 12px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .chat-composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .chat-input {
      min-height: 44px;
      max-height: 150px;
      resize: none;
      border: 0;
      border-radius: 0;
      padding: 10px;
      background: transparent;
    }

    .chat-input:focus {
      outline: none;
      border-color: transparent;
    }

    .send-button {
      min-width: 94px;
      background: var(--accent);
    }

    .error {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    @media (max-width: 720px) {
      header { display: block; }
      .status { margin-top: 10px; text-align: left; }
      .controls { align-items: stretch; }
      .control, button { width: 100%; }
      .result-head { display: block; }
      .score { margin-top: 8px; }
      .chat-shell {
        height: calc(100vh - 132px);
        min-height: 520px;
      }
      .chat-topbar {
        align-items: stretch;
        flex-direction: column;
      }
      .chat-actions {
        justify-content: stretch;
      }
      .chat-actions .control,
      .chat-actions button {
        width: 100%;
      }
      .message-row {
        max-width: 100%;
      }
      .avatar {
        display: none;
      }
      .chat-thread {
        padding: 14px;
      }
      .chat-composer {
        grid-template-columns: 1fr;
      }
      .send-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Local RAG Retrieval</h1>
        <p class="subtitle">Vector, BM25, and hybrid RRF search over ChromaDB chunks</p>
      </div>
      <div class="status" id="status">Checking collection...</div>
    </header>

    <nav class="tabs">
      <button class="tab-button active" id="labTab" type="button">Retrieval Lab</button>
      <button class="tab-button" id="chatTab" type="button">Chat</button>
    </nav>

    <section class="view" id="labView">
      <section class="search-panel">
        <label for="query">Query</label>
        <textarea id="query" placeholder="Example: Who are the Dursleys?"></textarea>

        <div class="controls">
          <div class="control">
            <label for="topK">Top K</label>
            <select id="topK">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="30">30</option>
              <option value="50">50</option>
            </select>
          </div>
          <div class="control">
            <label for="searchMode">Mode</label>
            <select id="searchMode">
              <option value="hybrid" selected>Hybrid</option>
              <option value="vector">Vector</option>
              <option value="bm25">BM25</option>
            </select>
          </div>
          <div class="control">
            <label for="year">Year</label>
            <input id="year" type="number" min="0" placeholder="Any" />
          </div>
          <div class="control">
            <label for="author">Author</label>
            <input id="author" type="text" placeholder="Any" />
          </div>
          <div class="control">
            <label for="documentType">Type</label>
            <input id="documentType" type="text" placeholder="book" />
          </div>
          <button id="searchButton">Search</button>
          <button id="rerankButton" disabled>Rerank top 5</button>
        </div>
        <div id="error"></div>
      </section>

      <section id="results"></section>
    </section>

    <section class="view" id="chatView" hidden>
      <section class="chat-shell">
        <div class="chat-topbar">
          <div>
            <div class="chat-title">RAG Chat</div>
            <div class="chat-subtitle" id="chatMemoryStatus">Память пуста</div>
          </div>
          <div class="chat-actions">
            <div class="control">
              <label class="compact-label" for="contextStrategy">Strategy</label>
            <select id="contextStrategy">
              <option value="auto" selected>Auto</option>
              <option value="direct">Direct</option>
              <option value="map_reduce">Map-reduce</option>
            </select>
            </div>
            <button class="secondary-button" id="clearChatButton" type="button">Clear memory</button>
          </div>
        </div>

        <section class="chat-thread" id="chatMessages"></section>

        <div class="chat-composer-wrap">
          <div id="chatError"></div>
          <form class="chat-composer" id="chatForm">
            <textarea class="chat-input" id="chatQuery" rows="1" placeholder="Напишите вопрос по документам"></textarea>
            <button class="send-button" id="askButton" type="submit">Send</button>
          </form>
        </div>
      </section>
      <section id="answerResults" hidden></section>
    </section>
  </main>

  <script>
    const statusNode = document.getElementById("status");
    const errorNode = document.getElementById("error");
    const resultsNode = document.getElementById("results");
    const labTab = document.getElementById("labTab");
    const chatTab = document.getElementById("chatTab");
    const labView = document.getElementById("labView");
    const chatView = document.getElementById("chatView");
    const button = document.getElementById("searchButton");
    const rerankButton = document.getElementById("rerankButton");
    const queryNode = document.getElementById("query");
    const topKNode = document.getElementById("topK");
    const searchModeNode = document.getElementById("searchMode");
    const yearNode = document.getElementById("year");
    const authorNode = document.getElementById("author");
    const documentTypeNode = document.getElementById("documentType");
    const chatErrorNode = document.getElementById("chatError");
    const answerResultsNode = document.getElementById("answerResults");
    const chatMessagesNode = document.getElementById("chatMessages");
    const chatMemoryStatusNode = document.getElementById("chatMemoryStatus");
    const askButton = document.getElementById("askButton");
    const clearChatButton = document.getElementById("clearChatButton");
    const chatForm = document.getElementById("chatForm");
    const chatQueryNode = document.getElementById("chatQuery");
    const contextStrategyNode = document.getElementById("contextStrategy");
    let lastSearchData = null;
    let chatHistory = [];
    let chatThread = [];
    let messageId = 0;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatScore(value) {
      if (value === null || value === undefined) return "n/a";
      return Number(value).toFixed(4);
    }

    async function loadHealth() {
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Health check failed");
        statusNode.textContent = `${data.collection} | ${data.count} chunks | ${data.embedding_model} | ${data.chat_model}`;
      } catch (error) {
        statusNode.textContent = "Collection unavailable";
      }
    }

    function switchView(view) {
      const showLab = view === "lab";
      labView.hidden = !showLab;
      chatView.hidden = showLab;
      labTab.classList.toggle("active", showLab);
      chatTab.classList.toggle("active", !showLab);
    }

    function renderResults(data) {
      const summaryLine = data.reranker_model
        ? `Reranker: ${escapeHtml(data.reranker_model)} | Input candidates: ${data.input_count} | Results: ${data.results.length}`
        : `Mode: ${escapeHtml(data.search_mode)} | Collection: ${escapeHtml(data.collection)} | Model: ${escapeHtml(data.embedding_model)} | Results: ${data.results.length}`;
      const summary = `
        <div class="summary">
          Query: <strong>${escapeHtml(data.query)}</strong><br>
          ${summaryLine}
          ${data.warning ? `<br><strong>${escapeHtml(data.warning)}</strong>` : ""}
        </div>
      `;

      const cards = data.results.map((item) => `
        <article class="result">
          <div class="result-head">
            <div>
              <div class="rank">#${item.rank} | ${escapeHtml(item.id)}</div>
              <div class="meta">
                <span class="pill">chunk_id: ${item.chunk_id ?? "n/a"}</span>
                <span class="pill">vector_rank: ${item.vector_rank ?? "n/a"}</span>
                <span class="pill">bm25_rank: ${item.bm25_rank ?? "n/a"}</span>
                <span class="pill">original_rank: ${item.original_rank ?? "n/a"}</span>
                <span class="pill">year: ${item.year ?? "n/a"}</span>
                <span class="pill">type: ${escapeHtml(item.document_type ?? "n/a")}</span>
                <span class="pill">author: ${escapeHtml(item.author ?? "n/a")}</span>
                <span class="pill">characters: ${item.characters ?? "n/a"}</span>
                <span class="pill">distance: ${formatScore(item.distance)}</span>
                <span class="pill">bm25: ${formatScore(item.bm25_score)}</span>
                <span class="pill">rrf: ${formatScore(item.rrf_score)}</span>
                <span class="pill">rerank: ${formatScore(item.rerank_score)}</span>
              </div>
              <div class="meta">
                <span class="pill">title: ${escapeHtml(item.title ?? "n/a")}</span>
              </div>
            </div>
            <div class="score">similarity ${formatScore(item.similarity)}</div>
          </div>
          <div class="chunk-text">${escapeHtml(item.text)}</div>
        </article>
      `).join("");

      resultsNode.innerHTML = summary + cards;
    }

    function updateChatMemoryStatus() {
      const turns = Math.floor(chatHistory.length / 2);
      chatMemoryStatusNode.textContent = turns
        ? `Память: ${turns} ${turns === 1 ? "диалог" : "диалогов"}`
        : "Память пуста";
    }

    function scrollChatToBottom() {
      requestAnimationFrame(() => {
        chatMessagesNode.scrollTop = chatMessagesNode.scrollHeight;
      });
    }

    function sourcePreview(text) {
      const normalized = String(text ?? "").replace(/\s+/g, " ").trim();
      return normalized.length > 360 ? `${normalized.slice(0, 360)}...` : normalized;
    }

    function renderAssistantDetails(data) {
      if (!data) return "";

      const standaloneQuery = data.standalone_query && data.standalone_query !== data.query
        ? `<span class="pill">query: ${escapeHtml(data.standalone_query)}</span>`
        : "";
      const warning = data.warning
        ? `<span class="pill">${escapeHtml(data.warning)}</span>`
        : "";
      const sources = (data.sources || []).map((item, index) => `
        <div class="source-item">
          <div class="source-title">#${index + 1} ${escapeHtml(item.title ?? item.doc_id ?? item.id)}</div>
          <div class="assistant-meta">
            <span class="pill">chunk: ${item.chunk_id ?? "n/a"}</span>
            <span class="pill">year: ${item.year ?? "n/a"}</span>
            <span class="pill">rerank: ${formatScore(item.rerank_score)}</span>
          </div>
          <div class="source-preview">${escapeHtml(sourcePreview(item.text))}</div>
        </div>
      `).join("");
      const mapSummaries = (data.map_summaries || []).map((summary, index) => `
        <div class="source-item">
          <div class="source-title">Map #${index + 1}</div>
          <div class="source-preview">${escapeHtml(summary)}</div>
        </div>
      `).join("");

      return `
        <div class="assistant-meta">
          <span class="pill">${escapeHtml(data.chat_model)}</span>
          <span class="pill">${escapeHtml(data.strategy)}</span>
          <span class="pill">context: ${data.estimated_context_tokens}/${data.context_token_limit}</span>
          <span class="pill">retrieval: ${data.retrieval_top_k}</span>
          <span class="pill">rerank: ${data.rerank_top_n}</span>
          ${standaloneQuery}
          ${warning}
        </div>
        ${sources ? `
          <details class="source-details">
            <summary>Sources (${data.sources.length})</summary>
            <div class="source-list">${sources}</div>
          </details>
        ` : ""}
        ${mapSummaries ? `
          <details class="map-details">
            <summary>Map summaries (${data.map_summaries.length})</summary>
            <div class="source-list">${mapSummaries}</div>
          </details>
        ` : ""}
      `;
    }

    function renderMessage(message) {
      const isUser = message.role === "user";
      const isError = message.error;
      const rowClass = isError ? "error" : message.role;
      const roleLabel = isUser ? "You" : "RAG";
      const avatarLabel = isUser ? "You" : "AI";
      const content = message.pending
        ? '<span class="thinking"><span></span><span></span><span></span></span>'
        : escapeHtml(message.content);

      return `
        <article class="message-row ${rowClass}">
          <div class="avatar">${avatarLabel}</div>
          <div class="message-bubble">
            <div class="message-role">${roleLabel}</div>
            <div class="message-content">${content}</div>
            ${message.data ? renderAssistantDetails(message.data) : ""}
          </div>
        </article>
      `;
    }

    function renderChatHistory() {
      updateChatMemoryStatus();

      if (!chatThread.length) {
        chatMessagesNode.innerHTML = `
          <div class="empty-chat">
            <div class="empty-chat-title">RAG Chat</div>
            <div>Задайте вопрос по загруженным документам.</div>
          </div>
        `;
        return;
      }

      chatMessagesNode.innerHTML = chatThread.map(renderMessage).join("");
      scrollChatToBottom();
    }

    function clearChatMemory() {
      chatHistory = [];
      chatThread = [];
      answerResultsNode.innerHTML = "";
      chatErrorNode.innerHTML = "";
      renderChatHistory();
    }

    function nextMessageId() {
      messageId += 1;
      return `message-${messageId}`;
    }

    function resizeChatInput() {
      chatQueryNode.style.height = "auto";
      chatQueryNode.style.height = `${Math.min(chatQueryNode.scrollHeight, 150)}px`;
    }

    async function runSearch() {
      const query = queryNode.value.trim();
      const topK = Number(topKNode.value);
      const searchMode = searchModeNode.value;
      const year = yearNode.value ? Number(yearNode.value) : null;
      const author = authorNode.value.trim() || null;
      const documentType = documentTypeNode.value.trim() || null;

      errorNode.innerHTML = "";
      resultsNode.innerHTML = "";
      lastSearchData = null;
      rerankButton.disabled = true;

      if (!query) {
        errorNode.innerHTML = '<div class="error">Enter a query first.</div>';
        return;
      }

      button.disabled = true;
      rerankButton.disabled = true;
      button.textContent = "Searching...";

      try {
        const response = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            top_k: topK,
            search_mode: searchMode,
            year,
            author,
            document_type: documentType,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Search failed");
        lastSearchData = data;
        rerankButton.disabled = data.search_mode !== "hybrid" || data.results.length === 0;
        renderResults(data);
      } catch (error) {
        errorNode.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      } finally {
        button.disabled = false;
        button.textContent = "Search";
      }
    }

    async function runRerank() {
      if (!lastSearchData || !lastSearchData.results.length) {
        errorNode.innerHTML = '<div class="error">Run Hybrid search first.</div>';
        return;
      }

      errorNode.innerHTML = "";
      rerankButton.disabled = true;
      rerankButton.textContent = "Reranking...";

      try {
        const response = await fetch("/api/rerank", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: lastSearchData.query,
            candidates: lastSearchData.results,
            top_n: 5,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Rerank failed");
        renderResults(data);
      } catch (error) {
        errorNode.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      } finally {
        rerankButton.disabled = false;
        rerankButton.textContent = "Rerank top 5";
      }
    }

    async function runAnswer(event) {
      if (event) event.preventDefault();

      const query = chatQueryNode.value.trim();
      const strategy = contextStrategyNode.value;
      const historyForRequest = chatHistory.slice();

      chatErrorNode.innerHTML = "";
      answerResultsNode.innerHTML = "";

      if (!query) {
        chatErrorNode.innerHTML = '<div class="error">Enter a question first.</div>';
        return;
      }

      const pendingId = nextMessageId();
      chatThread.push({ id: nextMessageId(), role: "user", content: query });
      chatThread.push({ id: pendingId, role: "assistant", content: "", pending: true });
      renderChatHistory();
      chatQueryNode.value = "";
      resizeChatInput();

      askButton.disabled = true;
      askButton.textContent = "Sending...";

      try {
        const response = await fetch("/api/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            strategy,
            retrieval_top_k: 20,
            rerank_top_n: 5,
            chat_history: historyForRequest,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Answer generation failed");
        chatHistory.push({ role: "user", content: query });
        chatHistory.push({ role: "assistant", content: data.answer });
        const pendingIndex = chatThread.findIndex((message) => message.id === pendingId);
        if (pendingIndex >= 0) {
          chatThread[pendingIndex] = {
            id: pendingId,
            role: "assistant",
            content: data.answer,
            data,
          };
        }
        renderChatHistory();
      } catch (error) {
        const pendingIndex = chatThread.findIndex((message) => message.id === pendingId);
        if (pendingIndex >= 0) {
          chatThread[pendingIndex] = {
            id: pendingId,
            role: "assistant",
            content: error.message,
            error: true,
          };
        }
        chatErrorNode.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        renderChatHistory();
      } finally {
        askButton.disabled = false;
        askButton.textContent = "Send";
      }
    }

    labTab.addEventListener("click", () => switchView("lab"));
    chatTab.addEventListener("click", () => switchView("chat"));
    button.addEventListener("click", runSearch);
    rerankButton.addEventListener("click", runRerank);
    chatForm.addEventListener("submit", runAnswer);
    clearChatButton.addEventListener("click", clearChatMemory);
    queryNode.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        runSearch();
      }
    });
    chatQueryNode.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        runAnswer();
      }
    });
    chatQueryNode.addEventListener("input", resizeChatInput);

    loadHealth();
    renderChatHistory();
    resizeChatInput();
  </script>
</body>
</html>
